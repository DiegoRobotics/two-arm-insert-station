ar_manipulator:
  kinematics_solver: pick_ik/PickIkPlugin
  kinematics_solver_timeout: 0.25
  kinematics_solver_attempts: 3
  mode: global                  # memetic global search + gradient descent
  position_scale: 1.0
  rotation_scale: 1.0
  position_threshold: 0.00001   # m
  orientation_threshold: 0.0001 # rad
  cost_threshold: 0.000001
  minimal_displacement_weight: 0.0
  gd_step_size: 0.0001
  gd_max_iters: 500
